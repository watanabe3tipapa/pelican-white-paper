{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ SITENAME }}{% endblock title %}
{% block body_id %}page{% endblock body_id %}

{% block content %}
<article class="article-detail page-detail">
  <header class="article-header">
    <p class="eyebrow">PAGE</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="article-body article-body--page">
    {{ page.content }}
  </div>
</article>
{% endblock content %}
